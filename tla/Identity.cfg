\* One peer with one wire slot, generations up to the limit 2, two sessions,
\* a share and table of two whose PUT caps equal them, two board cores, one
\* lease per GET and rows that linger one tick; each case widens one bound or
\* enables one fault.
CONSTANTS
    Upload = TRUE
    Mismatch = FALSE
    StaleData = FALSE
    Peers = {1}
    Slots = {1}
    Gens = {1, 2}
    Epochs = {1, 2}
    Share = 2
    Table = 2
    PutCap = 2
    PeerPutCap = 2
    Cores = {1, 2}
    Leases = 1
    Linger = 1
SPECIFICATION Spec
INVARIANTS TypeOK Safety
