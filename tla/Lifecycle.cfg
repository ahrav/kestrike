\* One PUT of two fragments into one payload range plus the header, and one
\* GET of two read commands, with every fault the case enables.
CONSTANTS
    Frags = {1, 2}
    Ranges = {0, 1}
    Cover <- OneRange
    Window = 1
    Chunks = 2
    Conflicts = FALSE
    Successor = FALSE
    Loss = FALSE
    Expiry = FALSE
    WriteFaults = TRUE
    Stops = FALSE
    Unproven = FALSE
    Deadlines = TRUE
    Get = FALSE
SPECIFICATION Spec
PROPERTY ClosedIsFinal
INVARIANTS TypeOK Safety
