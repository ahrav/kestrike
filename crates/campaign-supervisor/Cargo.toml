[package]
name = "campaign-supervisor"
version = "0.1.0"
edition = "2024"
description = "The campaign launcher and supervisor: a single-writer record store over one locked state directory."
license = "MIT OR Apache-2.0"
repository = "https://github.com/ahrav/kestrike"
publish = false

[target.'cfg(all(target_os = "linux", target_pointer_width = "64"))'.dependencies]
libc = "0.2.189"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.11.0"

[target.'cfg(all(target_os = "linux", target_pointer_width = "64"))'.dev-dependencies]
sim-host = { path = "../sim-host" }

[[bin]]
name = "campaign"
path = "src/main.rs"

# The launcher against a fake worker: this target re-executes itself as the
# archived worker, so it runs its own cases and prints libtest's lines.
[[test]]
name = "sim_launch"
path = "tests/sim_launch/main.rs"
harness = false

[[test]]
name = "custody"
path = "tests/custody/main.rs"
harness = false
