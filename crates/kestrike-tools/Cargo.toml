[package]
name = "kestrike-tools"
version = "0.1.0"
edition = "2024"
description = "The repository's tools, each a module of one binary that `scripts/tool.sh` builds and starts."
license = "MIT OR Apache-2.0"
repository = "https://github.com/ahrav/kestrike"
publish = false

[dependencies]
libc = "0.2.189"
sha2 = "0.11.0"
signal-hook = "0.3.18"

# The binary and the library would both get a unit-test target named
# `kestrike_tools`; the library's holds the unit tests.
[[bin]]
name = "kestrike-tools"
test = false
