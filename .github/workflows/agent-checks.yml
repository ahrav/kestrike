  # The guest lane uses provisioned inputs and the test executable built at this revision.
  # Its measured KVM deadlines and receipt are required on schedule and manual dispatch.
  qemu:
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    needs: [preflight, workspace]
    runs-on: [self-hosted, linux, x64, kestrike-ci-heavy]
    timeout-minutes: 85
    env:
      EVIDENCE: ${{ github.workspace }}/evidence
      KESTRIKE_GUEST_INPUTS: /etc/kestrike/guest-inputs.env
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Pinned toolchains
        run: >-
          exec timeout --kill-after=60s 10m
          bash scripts/rust-lane.sh toolchains
      # The step holds the host listings' and the build's deadlines (15 minutes each) and the guest run's (16).
      - name: Guest binder in a disposable QEMU guest
        run: >-
          exec timeout --kill-after=60s 65m
          bash scripts/rust-lane.sh qemu
      - name: Summary
        if: always()
        run: bash scripts/rust-lane.sh summary qemu
      - name: Obligation receipt and credit
        if: always()
