  tlc:
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    needs: [preflight, workspace]
    runs-on: [self-hosted, linux, x64, kestrike-ci-heavy]
    timeout-minutes: 130
    env:
      EVIDENCE: ${{ github.workspace }}/evidence
      TLC_PROFILE: >-
        ${{ github.event_name == 'schedule' && 'scheduled' || 'pr' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Pinned toolchains
        run: >-
          exec timeout --kill-after=60s 10m
          bash scripts/rust-lane.sh toolchains
      - name: TLC profile under the pinned JDK and TLA+ tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          exec timeout --kill-after=60s 110m
          bash scripts/rust-lane.sh tlc "$TLC_PROFILE"
      - name: Summary
        if: always()
