          --receipt evidence/receipt.json --evidence evidence
      - name: Evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: >-
            evidence-tlc-${{ github.run_id
            }}-${{ github.run_attempt }}
          path: evidence
          retention-days: ${{ job.status == 'success' && 14 || 90 }}
          if-no-files-found: error

  quint-shard:
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    needs: [preflight, workspace]
    runs-on: [self-hosted, linux, x64, kestrike-ci-heavy]
    timeout-minutes: 445
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    steps:
      - name: Prepare shard evidence
        id: prepare
        env:
          QUINT_SHARD: ${{ matrix.shard }}
        run: |
          umask 077
          evidence=$(mktemp -d "$RUNNER_TEMP/quint-shard-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$QUINT_SHARD.XXXXXXXX")
          printf 'EVIDENCE=%s\n' "$evidence" >> "$GITHUB_ENV"
          printf 'path=%s\n' "$evidence" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Pinned toolchains
        run: >-
          exec timeout --kill-after=60s 10m
          bash scripts/rust-lane.sh toolchains
      - name: Quint models under the pinned JDK, Node.js, Apalache and Quint
        env:
          QUINT_SHARD: ${{ matrix.shard }}
        run: >-
          exec timeout --kill-after=60s 420m
          bash scripts/rust-lane.sh quint "$QUINT_SHARD"
      - name: Raw shard evidence
        if: always() && steps.prepare.outputs.path != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: >-
            quint-shard-${{ matrix.shard }}-${{ github.run_id
            }}-${{ github.run_attempt }}
          path: ${{ steps.prepare.outputs.path }}
          retention-days: ${{ job.status == 'success' && 14 || 90 }}
          if-no-files-found: error

  # The join's verdict on the shard artifacts serves as the lane's receipt,
  # including when the join refuses them.
  quint:
    if: >-
      always() && needs.quint-shard.result != 'skipped' &&
      (github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch')
    needs: quint-shard
    runs-on: [self-hosted, linux, x64, kestrike-ci-heavy]
    timeout-minutes: 30
    steps:
      - name: Prepare Quint receipt
        id: prepare
        run: |
          umask 077
          evidence=$(mktemp -d "$RUNNER_TEMP/quint-receipt-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.XXXXXXXX")
          mkdir "$evidence/shards"
          printf 'EVIDENCE=%s\n' "$evidence" >> "$GITHUB_ENV"
          printf 'path=%s\n' "$evidence" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        id: checkout
        with:
          persist-credentials: false
      - name: This attempt's Quint shards
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          pattern: >-
            quint-shard-*-${{ github.run_id
            }}-${{ github.run_attempt }}
          path: ${{ steps.prepare.outputs.path }}/shards
          merge-multiple: false
      - name: Judge all Quint shards
        run: python3 scripts/judge-quint.py judge --evidence "$EVIDENCE"
      - name: Summary
        if: always() && steps.checkout.outcome == 'success'
        run: bash scripts/rust-lane.sh summary quint
      - name: Obligation receipt and credit
        if: always() && steps.checkout.outcome == 'success'
        run: >-
          python3 scripts/verify-receipts.py credit --job quint
          --receipt "$EVIDENCE/receipt.json" --evidence "$EVIDENCE"
      - name: Evidence
        if: always() && steps.prepare.outputs.path != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: >-
            evidence-quint-${{ github.run_id
            }}-${{ github.run_attempt }}
          path: |
            ${{ steps.prepare.outputs.path }}/report.json
            ${{ steps.prepare.outputs.path }}/receipt.json
            ${{ steps.prepare.outputs.path }}/credit.json
            ${{ steps.prepare.outputs.path }}/pins.txt
            ${{ steps.prepare.outputs.path }}/quint-shards.json
          retention-days: ${{ job.status == 'success' && 14 || 90 }}
          if-no-files-found: error
      - name: Raw shards of a refused judgment
        if: failure() && steps.prepare.outputs.path != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: >-
            quint-refused-${{ github.run_id
            }}-${{ github.run_attempt }}
          path: ${{ steps.prepare.outputs.path }}/shards
          retention-days: 90
          if-no-files-found: ignore

  quarantine:
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    needs: preflight
    runs-on: [self-hosted, linux, x64, kestrike-ci-heavy]
    timeout-minutes: 130
    env:
      EVIDENCE: ${{ github.workspace }}/evidence
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Pinned toolchains
        run: >-
          exec timeout --kill-after=60s 10m
          bash scripts/rust-lane.sh toolchains
      - name: Quarantined tests by exact ID
        run: >-
          exec timeout --kill-after=60s 110m
          bash scripts/rust-lane.sh quarantine
      - name: Evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: >-
            evidence-quarantine-${{ github.run_id
            }}-${{ github.run_attempt }}
          path: evidence
          retention-days: ${{ job.status == 'success' && 14 || 90 }}
          if-no-files-found: error

  # The FIS controller suite runs its fakes for about seven minutes, a long test by the lane admission rule, so it
  # runs on the schedule and on dispatch after the workspace, in a job of its own that no lane needs and the gate
  # leaves outside, as the quarantine lane is: a failure here is diagnostic and holds back no other lane. A pull
  # request's author runs the suite locally.
  fis-controller:
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    needs: workspace
    runs-on: [self-hosted, linux, x64, kestrike-ci-heavy]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: FIS controller tests
        run: python3 scripts/test-fis-controller.py

  rust-gate:
    if: always() && (github.event_name != 'pull_request' || !cancelled())
    needs: [comment-policy, lane-script, rust-format, preflight, workspace, rc11, barriers, campaigns, search, fuzz-smoke, long-run, search-nightly, verus, loom, miri, sweep, genmc, kani, tlc, quint, fuzz, asan, qemu, isa-x86-64, isa-aarch64, tag-compare-x86-64, tag-compare-aarch64]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # A fork pull request checks nothing out and runs no lane, so the gate
      # fails here before any step reads the runner's workspace.
      - name: Fork pull requests run no lanes
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name != github.repository
        run: exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: >-
          always() && (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
        with:
          persist-credentials: false
      - name: Every selected Rust lane succeeded
        if: >-
          github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          RESULTS: ${{ toJSON(needs) }}
          EVENT_ACTION: ${{ github.event.action }}
        run: >-
          python3 scripts/verify-receipts.py gate
          --event "$GITHUB_EVENT_NAME"
          --action "$EVENT_ACTION"
      - name: This attempt's lane evidence
        if: >-
          always() && (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          pattern: >-
            evidence-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: lanes
      - name: Every selected lane credited its declared domain
        if: >-
          always() && (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
        run: >-
          python3 scripts/verify-receipts.py aggregate --lanes lanes
          --event "$GITHUB_EVENT_NAME"
          --revision "$GITHUB_SHA"
          --run "$GITHUB_RUN_ID"
          --run-attempt "$GITHUB_RUN_ATTEMPT"
      - name: The Verus trust inventory matches its sources
        if: >-
          always() && (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
        run: python3 scripts/judge-verus.py reconcile
