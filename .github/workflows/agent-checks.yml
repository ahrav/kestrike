      EVIDENCE: ${{ github.workspace }}/evidence
      GENMC_PROFILE: >-
        ${{ github.event_name == 'schedule' && 'scheduled' || 'pr' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
