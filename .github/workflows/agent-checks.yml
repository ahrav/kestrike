name: agent-checks

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event_name }}-${{
    github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  STABLE: "1.99.0"
  NIGHTLY: "nightly-2026-07-27"
  CARGO_FUZZ: "0.13.2"
  LOOM: "0.7.2"
  HERDTOOLS7: "7.58"
  LLVM: "22.1.8"
  KANI: "0.68.0"
  SPDK_COMMIT: 44b23be7c35469bc0aba4b942c08c935125e2315
  SPDK_VERSION: "25.5.1"
  DPDK_COMMIT: cf36799c473a686fa14fde9af97f917a2125d3d5
  DPDK_VERSION: "25.03.0"
  SPDK_PKG_CONFIG_PATH: /opt/spdk-v25.05.1-x86-64-v2/lib/pkgconfig
  CARGO_TERM_COLOR: never
  CARGO_BUILD_JOBS: "4"
  RUST_TEST_THREADS: "4"

jobs:
  comment-policy:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    # Receipt cases share a bounded worker pool; hardware fault scenarios run
    # on heavy events and changes to their inputs, with smoke checks on every event.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Comment markers
        run: bash scripts/forbid-comment-markers.sh
      # The measurement-frame checks resolve Rust source anchors with the
      # source-anchors crate, which they build with cargo.
      - name: Pinned toolchain
        run: >-
          exec timeout --kill-after=30s 5m
          rustup toolchain install "$STABLE" --profile minimal
      - name: Hook regression tests
        run: python3 scripts/test-agent-hooks.py
      - name: Receipt replay self-test
        run: python3 scripts/test-chaos-receipt-replay.py
      - name: Review workflow contract tests
        run: python3 scripts/test-review-workflow.py
      - name: Script self-checks
        env:
          MEASUREMENT_BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'origin/main' }}
          RUSTUP_TOOLCHAIN: ${{ env.STABLE }}
        run: |
          python3 scripts/test-select-tests.py
          python3 scripts/test-reproduce-test.py
          python3 scripts/test-red-green.py
          python3 scripts/test-hardware-lane.py --ci
          python3 scripts/test-run-receipt-selftests.py
          python3 scripts/run-receipt-selftests.py
          python3 scripts/test-judge-rc11.py
          python3 scripts/test-judge-genmc.py
          bash scripts/tool.sh weaken-orderings check
          python3 scripts/test-judge-verus.py
          python3 scripts/test-judge-kani.py
          python3 scripts/test-judge-tlc.py
          python3 scripts/test-judge-quint.py
          python3 scripts/test-scan-barriers.py
          python3 scripts/test-scan-tag-compare.py
          python3 scripts/test-guest-binder.py
          python3 scripts/test-qualified-envelope.py
          python3 scripts/test-hit-gate.py
          python3 scripts/test-recovery-packages.py
          python3 scripts/test-measurement-frame.py
          python3 scripts/measurement-frame.py check --base "$MEASUREMENT_BASE"
          python3 scripts/test-sizing-worksheet.py
          python3 scripts/sizing-worksheet.py check
          python3 scripts/test-acceptance.py
          python3 scripts/acceptance.py check
          python3 scripts/test-readiness.py
          python3 scripts/readiness.py check
          python3 scripts/test-quint-check.py
      - name: Obligation catalog admission
        run: python3 scripts/verify-receipts.py admit
      # A pull request's checkout is its test merge. The merge's first parent is
      # the base commit GitHub merged into, which `pull_request.base.sha` can lag.
      - name: Weakened-test scan
        env:
          SCAN_BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || github.event.before || 'origin/main' }}
        run: bash scripts/ci-scan-weakened-tests.sh --base "$SCAN_BASE"

  lane-script:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Lane cancellation tests
        run: python3 scripts/test-rust-lane.py

  rust-format:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Pinned rustfmt
        run: >-
          exec timeout --kill-after=30s 5m
          rustup toolchain install "$STABLE" --profile minimal --component rustfmt
      - name: Rust format check
        run: |
          set -euo pipefail
          git ls-files -z '*.rs' > "$RUNNER_TEMP/rust-files"
          test -s "$RUNNER_TEMP/rust-files"
          exec timeout --kill-after=30s 5m \
            xargs -0 -a "$RUNNER_TEMP/rust-files" \
            rustup run "$STABLE" rustfmt --check

  preflight:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, "${{ (github.event_name == 'pull_request' || github.event_name == 'push') && 'kestrike-vm-build' || 'kestrike-ci-heavy' }}"]
    timeout-minutes: 50
    outputs:
      loom-modules: ${{ steps.preflight.outputs.loom-modules }}
    env:
      EVIDENCE: ${{ github.workspace }}/evidence
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Pinned toolchains
        run: >-
          exec timeout --kill-after=60s 10m
          bash scripts/rust-lane.sh toolchains
      - name: Native pins and registry tests
        id: preflight
        run: >-
          exec timeout --kill-after=60s 30m
          bash scripts/rust-lane.sh preflight
      - name: Evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: >-
            evidence-preflight-${{ github.run_id
            }}-${{ github.run_attempt }}
          path: evidence
          retention-days: ${{ job.status == 'success' && 14 || 90 }}
          if-no-files-found: error

  workspace:
    needs: preflight
    runs-on: [self-hosted, linux, x64, "${{ (github.event_name == 'pull_request' || github.event_name == 'push') && 'kestrike-vm-build' || 'kestrike-ci-heavy' }}"]
    timeout-minutes: 185
    env:
      EVIDENCE: ${{ github.workspace }}/evidence
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Pinned toolchains
        run: >-
          exec timeout --kill-after=60s 10m
          bash scripts/rust-lane.sh toolchains
      - name: Lint, workspace suite and protocol contract
        run: >-
          exec timeout --kill-after=60s 165m
          bash scripts/rust-lane.sh workspace
      - name: Summary
        if: always()
        run: bash scripts/rust-lane.sh summary workspace
      - name: Obligation receipt and credit
        if: always()
        run: python3 scripts/verify-receipts.py credit --job workspace --evidence evidence
      - name: Evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: >-
            evidence-workspace-${{ github.run_id
            }}-${{ github.run_attempt }}
          path: evidence
          retention-days: ${{ job.status == 'success' && 14 || 90 }}
          if-no-files-found: error

  campaigns:
    needs: [preflight, workspace]
    runs-on: [self-hosted, linux, x64, "${{ (github.event_name == 'pull_request' || github.event_name == 'push') && 'kestrike-vm-build' || 'kestrike-ci-heavy' }}"]
    timeout-minutes: 90
    env:
      EVIDENCE: ${{ github.workspace }}/evidence
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Pinned toolchains
        run: >-
          exec timeout --kill-after=60s 10m
          bash scripts/rust-lane.sh toolchains
      - name: Worker campaigns by exact ID
        run: >-
          exec timeout --kill-after=60s 70m
          bash scripts/rust-lane.sh campaigns
      - name: Summary
        if: always()
        run: bash scripts/rust-lane.sh summary campaigns
      - name: Obligation receipt and credit
        if: always()
        run: python3 scripts/verify-receipts.py credit --job campaigns --evidence evidence
      - name: Evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: >-
            evidence-campaigns-${{ github.run_id
            }}-${{ github.run_attempt }}
          path: evidence
          retention-days: ${{ job.status == 'success' && 14 || 90 }}
          if-no-files-found: error

  search:
    needs: [preflight, workspace]
    runs-on: [self-hosted, linux, x64, "${{ (github.event_name == 'pull_request' || github.event_name == 'push') && 'kestrike-vm-build' || 'kestrike-ci-heavy' }}"]
    timeout-minutes: 90
    env:
      EVIDENCE: ${{ github.workspace }}/evidence
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Pinned toolchains
        run: >-
          exec timeout --kill-after=60s 10m
          bash scripts/rust-lane.sh toolchains
      - name: ServeCore search, pull-request bound
        run: >-
          exec timeout --kill-after=60s 70m
          bash scripts/rust-lane.sh search
      - name: Summary
        if: always()
        run: bash scripts/rust-lane.sh summary search
      - name: Obligation receipt and credit
        if: always()
        run: python3 scripts/verify-receipts.py credit --job search --evidence evidence
      - name: Evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: >-
            evidence-search-${{ github.run_id
            }}-${{ github.run_attempt }}
          path: evidence
          retention-days: ${{ job.status == 'success' && 14 || 90 }}
          if-no-files-found: error

  fuzz-smoke:
    needs: preflight
    runs-on: [self-hosted, linux, x64, "${{ (github.event_name == 'pull_request' || github.event_name == 'push') && 'kestrike-vm-build' || 'kestrike-ci-heavy' }}"]
    timeout-minutes: 100
    env:
      EVIDENCE: ${{ github.workspace }}/evidence
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Pinned toolchains
        run: >-
          exec timeout --kill-after=60s 10m
          bash scripts/rust-lane.sh toolchains
      - name: Frame, campaign and parser fuzz smoke
        run: >-
          exec timeout --kill-after=60s 80m
          bash scripts/rust-lane.sh fuzz-smoke
      - name: Summary
        if: always()
        run: bash scripts/rust-lane.sh summary fuzz-smoke
      - name: Obligation receipt and credit
        if: always()
        run: python3 scripts/verify-receipts.py credit --job fuzz-smoke --evidence evidence
      - name: Evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: >-
            evidence-fuzz-smoke-${{ github.run_id
            }}-${{ github.run_attempt }}
          path: evidence
          retention-days: ${{ job.status == 'success' && 14 || 90 }}
          if-no-files-found: error

  search-nightly:
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    needs: [preflight, workspace]
    runs-on: [self-hosted, linux, x64, kestrike-ci-heavy]
    timeout-minutes: 90
    env:
      EVIDENCE: ${{ github.workspace }}/evidence
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Pinned toolchains
        run: >-
          exec timeout --kill-after=60s 10m
          bash scripts/rust-lane.sh toolchains
      - name: ServeCore search, nightly bounds
        run: >-
          exec timeout --kill-after=60s 70m
          bash scripts/rust-lane.sh search-nightly
      - name: Summary
        if: always()
        run: bash scripts/rust-lane.sh summary search-nightly
      - name: Obligation receipt and credit
        if: always()
        run: python3 scripts/verify-receipts.py credit --job search-nightly --evidence evidence
      - name: Evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: >-
            evidence-search-nightly-${{ github.run_id
            }}-${{ github.run_attempt }}
          path: evidence
          retention-days: ${{ job.status == 'success' && 14 || 90 }}
          if-no-files-found: error

  # The architecture qualification lanes run their kernels' witness tests by
  # exact ID on a native host whose CPU reports every feature the lane's
  # inventory entry declares; a host short of one fails the lane.
  isa-x86-64:
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    needs: [preflight, workspace]
    runs-on: [self-hosted, linux, x64, kestrike-isa-x86-64]
    timeout-minutes: 90
    env:
      EVIDENCE: ${{ github.workspace }}/evidence
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Pinned toolchains
        run: >-
          exec timeout --kill-after=60s 10m
          bash scripts/rust-lane.sh toolchains
      - name: Architecture qualification
        run: >-
          exec timeout --kill-after=60s 70m
          bash scripts/rust-lane.sh isa-x86-64
      - name: Summary
        if: always()
        run: bash scripts/rust-lane.sh summary isa-x86-64
      - name: Obligation receipt and credit
        if: always()
        run: python3 scripts/verify-receipts.py credit --job isa-x86-64 --evidence evidence
      - name: Evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: >-
            evidence-isa-x86-64-${{ github.run_id
            }}-${{ github.run_attempt }}
          path: evidence
          retention-days: ${{ job.status == 'success' && 14 || 90 }}
          if-no-files-found: error

  isa-aarch64:
    if: >-
      false &&
      (github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch')
    needs: [preflight, workspace]
    runs-on: [self-hosted, linux, arm64, kestrike-isa-aarch64]
    timeout-minutes: 175
    env:
      EVIDENCE: ${{ github.workspace }}/evidence
      # The AArch64 host keeps its native install; the portable install is
      # x86-64 only.
      SPDK_PKG_CONFIG_PATH: /usr/local/lib/pkgconfig
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Pinned toolchains
        run: >-
          exec timeout --kill-after=60s 10m
          bash scripts/rust-lane.sh toolchains
      - name: Architecture qualification
        run: >-
          exec timeout --kill-after=60s 70m
          bash scripts/rust-lane.sh isa-aarch64
      # The 50-minute timeout covers the lane's build (26 minutes), run
      # (16 minutes), and control (3 minutes) deadlines.
      - name: ThreadSanitizer run and planted race
        if: ${{ !cancelled() }}
        env:
          EVIDENCE: ${{ github.workspace }}/evidence/tsan
        run: >-
          exec timeout --kill-after=60s 50m
          bash scripts/rust-lane.sh tsan
      # The litmus lane writes to `evidence/litmus` to keep its results
      # separate from qualification evidence.
      - name: Native litmus loops beside their weakened twins
        if: ${{ !cancelled() }}
        env:
          EVIDENCE: ${{ github.workspace }}/evidence/litmus
        run: >-
          exec timeout --kill-after=60s 35m
          bash scripts/rust-lane.sh litmus
      - name: Summary
        if: always()
        run: bash scripts/rust-lane.sh summary isa-aarch64
      - name: Obligation receipt and credit
        if: always()
        run: python3 scripts/verify-receipts.py credit --job isa-aarch64 --evidence evidence
      - name: Evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: >-
            evidence-isa-aarch64-${{ github.run_id
            }}-${{ github.run_attempt }}
          path: evidence
          retention-days: ${{ job.status == 'success' && 14 || 90 }}
          if-no-files-found: error

  long-run:
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    needs: [preflight, workspace]
    runs-on: [self-hosted, linux, x64, kestrike-ci-heavy]
    timeout-minutes: 90
    env:
      EVIDENCE: ${{ github.workspace }}/evidence
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Pinned toolchains
        run: >-
          exec timeout --kill-after=60s 10m
          bash scripts/rust-lane.sh toolchains
      - name: Long-run gate
        run: >-
          exec timeout --kill-after=60s 70m
          bash scripts/rust-lane.sh long-run
      - name: Summary
        if: always()
        run: bash scripts/rust-lane.sh summary long-run
      - name: Obligation receipt and credit
        if: always()
        run: python3 scripts/verify-receipts.py credit --job long-run --evidence evidence
      - name: Evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: >-
            evidence-long-run-${{ github.run_id
            }}-${{ github.run_attempt }}
          path: evidence
          retention-days: ${{ job.status == 'success' && 14 || 90 }}
          if-no-files-found: error

  loom:
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    needs: [preflight, workspace]
    runs-on: [self-hosted, linux, x64, kestrike-ci-heavy]
    timeout-minutes: 110
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        module: ${{ fromJSON(needs.preflight.outputs.loom-modules) }}
    env:
      EVIDENCE: ${{ github.workspace }}/evidence
      MODULE: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Pinned toolchains
        run: >-
          exec timeout --kill-after=60s 10m
          bash scripts/rust-lane.sh toolchains
      - name: Loom kernel
        run: >-
          exec timeout --kill-after=60s 90m
          bash scripts/rust-lane.sh loom "$MODULE"
      - name: Summary
        if: always()
        run: bash scripts/rust-lane.sh summary loom "$MODULE"
      - name: Obligation receipt and credit
        if: always()
        run: >-
          python3 scripts/verify-receipts.py credit --job loom
          --module "$MODULE" --evidence evidence
      - name: Evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: >-
            evidence-loom-${{ matrix.module }}-${{ github.run_id
            }}-${{ github.run_attempt }}
          path: evidence
          retention-days: ${{ job.status == 'success' && 14 || 90 }}
          if-no-files-found: error

  fuzz:
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    needs: [preflight, workspace]
    runs-on: [self-hosted, linux, x64, kestrike-ci-heavy]
    timeout-minutes: 130
    env:
      EVIDENCE: ${{ github.workspace }}/evidence
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Pinned toolchains
        run: >-
          exec timeout --kill-after=60s 10m
          bash scripts/rust-lane.sh toolchains
      - name: Frame, campaign and parser fuzz
        run: >-
          exec timeout --kill-after=60s 110m
          bash scripts/rust-lane.sh fuzz
      - name: Summary
        if: always()
        run: bash scripts/rust-lane.sh summary fuzz
      - name: Obligation receipt and credit
        if: always()
        run: python3 scripts/verify-receipts.py credit --job fuzz --evidence evidence
      - name: Evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: >-
            evidence-fuzz-${{ github.run_id
            }}-${{ github.run_attempt }}
          path: evidence
          retention-days: ${{ job.status == 'success' && 14 || 90 }}
          if-no-files-found: error

  miri:
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    needs: [preflight, workspace]
    runs-on: [self-hosted, linux, x64, kestrike-ci-heavy]
    timeout-minutes: 85
    env:
      EVIDENCE: ${{ github.workspace }}/evidence
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Pinned toolchains
        run: >-
          exec timeout --kill-after=60s 10m
          bash scripts/rust-lane.sh toolchains
      - name: Miri ownership corpus
        run: >-
          exec timeout --kill-after=60s 65m
          bash scripts/rust-lane.sh miri
      - name: Summary
        if: always()
        run: bash scripts/rust-lane.sh summary miri
      - name: Obligation receipt and credit
        if: always()
        run: python3 scripts/verify-receipts.py credit --job miri --evidence evidence
      - name: Evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: >-
            evidence-miri-${{ github.run_id
            }}-${{ github.run_attempt }}
          path: evidence
          retention-days: ${{ job.status == 'success' && 14 || 90 }}
          if-no-files-found: error

  asan:
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    needs: [preflight, workspace]
    runs-on: [self-hosted, linux, x64, kestrike-ci-heavy]
    timeout-minutes: 75
    env:
      EVIDENCE: ${{ github.workspace }}/evidence
      SPDK_PKG_CONFIG_PATH: /opt/spdk-v25.05.1-asan/lib/pkgconfig
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Pinned toolchains
        run: >-
          exec timeout --kill-after=60s 10m
          bash scripts/rust-lane.sh toolchains
      # The step holds both listings' deadlines (15 minutes each) and the run's (20).
      - name: Address-sanitized library tests
        run: >-
          exec timeout --kill-after=60s 55m
          bash scripts/rust-lane.sh asan
      - name: Summary
        if: always()
        run: bash scripts/rust-lane.sh summary asan
      - name: Obligation receipt and credit
        if: always()
        run: python3 scripts/verify-receipts.py credit --job asan --evidence evidence
      - name: Evidence
        if: always()
