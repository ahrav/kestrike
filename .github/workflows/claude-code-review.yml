name: claude-code-review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened, converted_to_draft, closed, edited]

# A newer push, a close, a draft conversion, or a base retarget supersedes a
# review still running on the same PR. A title or body edit gets its own group:
# a newer pending run cancels an older pending run in its group even when its
# job is skipped, so sharing the group would drop the pending review of a push.
concurrency:
  group: claude-code-review-${{ github.event.pull_request.number }}${{ github.event.action == 'edited' && github.event.changes.base == null && '-noop' || '' }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      github.event.action != 'closed' &&
      (github.event.action != 'edited' || github.event.changes.base != null) &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: read
    # The same rustfmt the workspace lane in agent-checks.yml runs.
    env:
      STABLE: "1.99.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Pinned rustfmt
        run: rustup toolchain install "$STABLE" --profile minimal --component rustfmt

      # Every input the model reads is written here by the steps below, and the
      # model's file reads are fenced to the checkout plus this directory.
      #
      # git produces the whole diff; the API diff stops at 300 files. The
      # info/attributes line outranks the checked-out .gitattributes, so a PR
      # cannot hide changed lines with `-diff` while binaries keep their marker.
      # A failure here ends the job before any review is posted; an empty diff
      # is a valid input.
      - name: Diff of the reviewed commits
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          merge_base=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BASE_SHA...$HEAD_SHA" --jq .merge_base_commit.sha)
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          GIT_CONFIG_COUNT=1 \
          GIT_CONFIG_KEY_0="http.$GITHUB_SERVER_URL/.extraheader" \
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" \
            git fetch --depth=1 origin "$merge_base"
          printf '* !diff\n' > "$(git rev-parse --git-path info)/attributes"
          mkdir -p "$RUNNER_TEMP/review"
          printf '%s\n' "$merge_base" > "$RUNNER_TEMP/review/merge-base"
          git diff --stat "$merge_base" "$HEAD_SHA" > "$RUNNER_TEMP/review/pr.diffstat"
          git diff "$merge_base" "$HEAD_SHA" > "$RUNNER_TEMP/review/pr.diff"

      # Both listings paginate; the API returns 30 comments per page.
      - name: Existing review comments
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/comments" > "$RUNNER_TEMP/review/review-comments.json"
          gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" > "$RUNNER_TEMP/review/issue-comments.json"

      # rustfmt alone reads only the sources and rustfmt.toml. cargo-fmt would
      # run `cargo metadata`, which executes the rustc a PR-supplied
      # .cargo/config.toml names, and this step runs before the action with no
      # secret in its environment. The explicit toolchain ignores a PR-supplied
      # rust-toolchain file.
      - name: Rust format check
        run: |
          set -euo pipefail
          merge_base=$(cat "$RUNNER_TEMP/review/merge-base")
          git diff -z --name-only --diff-filter=d "$merge_base" "$GITHUB_SHA_HEAD" -- '*.rs' > "$RUNNER_TEMP/review/changed-rust-files"
          if [ -s "$RUNNER_TEMP/review/changed-rust-files" ]; then
            status=0
            xargs -0 -a "$RUNNER_TEMP/review/changed-rust-files" \
              rustup run "$STABLE" rustfmt --check --edition 2024 > "$RUNNER_TEMP/review/rustfmt.txt" 2>&1 || status=$?
            printf '\nrustfmt exit status: %s\n' "$status" >> "$RUNNER_TEMP/review/rustfmt.txt"
          fi
        env:
          GITHUB_SHA_HEAD: ${{ github.event.pull_request.head.sha }}

      # v1.0.247
      - uses: anthropics/claude-code-action@2dca132ff0e0c4094ce6048b422c6915a071210b
        id: review
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          classify_inline_comments: "false"
          prompt: |
            Review pull request ${{ github.repository }}#${{ github.event.pull_request.number }} at head commit ${{ github.event.pull_request.head.sha }}. The checkout is that commit, except that `.claude/`, `.mcp.json`, `CLAUDE.md`, `.gitmodules`, `.ripgreprc` and `.husky/` come from the base branch; the PR's versions of those paths, when it changes them, are under `.claude-pr/`.
            This run was triggered by a "${{ github.event.action }}" event. Review the PR on every run, including when earlier reviews exist. This run has no shell; the workflow wrote every input you need under `${{ runner.temp }}/review/`.

            1. Read REVIEW.md and AGENTS.md at the repository root. REVIEW.md is the review policy, except that this run posts its findings: steps 4 and 5 replace "Stay read-only." and "Return review findings without posting comments or mutating issues."
            2. Read this run's diff from `${{ runner.temp }}/review/pr.diff` (file list in `${{ runner.temp }}/review/pr.diffstat`); the workflow generated it from the merge base and the head commit. Read surrounding code, callers, and tests in the checkout as REVIEW.md asks. When the diff changes Rust, `${{ runner.temp }}/review/rustfmt.txt` holds the workflow's rustfmt check of the changed files with the pinned toolchain, ending in its exit status; report that result as the formatting check. Build, clippy, and test verification were not run; say so.
            3. Findings already posted on this PR are in `${{ runner.temp }}/review/review-comments.json` (inline) and `${{ runner.temp }}/review/issue-comments.json` (top-level). Read both files before posting anything. Do not repeat a finding that is already posted and still applies. A finding the latest commits fixed needs no new comment.
            4. Post each new finding as an inline comment with mcp__github_inline_comment__create_inline_comment, with severity, evidence, consequence, and smallest fix. Pass commit_id ${{ github.event.pull_request.head.sha }} on every call. For a line that exists at that commit, use its line number there. For a deleted line, pass side LEFT with the line number from the old file. A finding in unchanged code, such as an unfixed sibling, anchors to the changed line that reaches or fixes it and names its own location.
            5. Finish by returning the summary in the structured output's `summary` field; the workflow posts it as a comment. Head it "Code review for <first 7 chars of the head commit>". Give counts of new findings by severity, and say "No new issues found" when there are none.

            Posting inline comments is the only write this run allows. Do not commit, push, edit files, or change issues or tracker state.
          # The inline-comment MCP server starts only when --allowedTools names it.
          # Bash is denied outright: Claude Code runs its built-in read-only
          # commands (cat, git, grep, echo, ...) with no allow rule, and the
          # action stores its token in .git/config and the job environment.
          # File reads are fenced to the checkout and the review directory.
          claude_args: |
            --model claude-opus-5-5
            --effort xhigh
            --allowedTools "Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment"
            --json-schema '{"type":"object","properties":{"summary":{"type":"string"}},"required":["summary"]}'
            --disallowedTools "Bash,Read(./.git/**),Read(//proc/**)"
            --add-dir ${{ runner.temp }}/review
            --settings '{"permissions":{"blockReadsOutsideWorkingDirectories":true}}'

      # The model's summary reaches gh as file contents, never as shell text.
      # A summary carrying the token means the model was steered; the job fails
      # and posts nothing.
      - name: Post review summary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STRUCTURED_OUTPUT: ${{ steps.review.outputs.structured_output }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          jq -er '.summary' <<<"$STRUCTURED_OUTPUT" > "$RUNNER_TEMP/review-summary.md"
          if grep -qF -- "$GH_TOKEN" "$RUNNER_TEMP/review-summary.md"; then
            echo "::error::the review summary contains the job token; nothing posted"
            exit 1
          fi
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/review-summary.md"
