# The validator and the claim read each block list line by line, so each item
# stays on one line, whatever its length.
system: kestrike-simulated, Kestrike as the archived simulation worker runs it under campaign
environment: one aarch64 worker that runs campaign sweep on an archive it builds, each run on a new root under /data/tsw/campaigns, with no storage device and no second host; its AWS role is refused the three probed actions of the fences, and trusted_base lists the reach no probe shows
scope:
  - Kestrike's library code that the archived simulation worker runs, crates/kestrike/src, as the profiles of chaos/ledger.json's scenario rows drive it
  - the records campaign writes for a sweep root, which the judges read as copies in a run's evidence directory
  - the planted ordering controls cluster-order-1, cluster-order-2 and cluster-order-3, each of which runs cluster-broad's scenario with a plant of depth 1, 2 or 3, and the rate at which one sweep catches each
out_of_scope:
  - the production driver, an EBS volume and every native or hardware lane
  - the AWS fault-injection lanes and the owner's simulation hosts, their units and their bucket
  - code no swept profile runs, such as bind and failover
  - cache behavior, performance and workflow files, which no unit of this contract changes
differs_from_production:
  - A reach count is evidence about the simulated environment only: it shows that a passing run of the named profile reached the event on this build at these counts, and it shows neither that a check judged the event nor that production reaches it.
  - every result is evidence about the simulation: one process runs every owner and client in virtual time, and seeds decide the order of events
  - the simulated device stands in for the production driver and an EBS volume, and the device differences table in crates/kestrike/src/storage/device/fidelity_tests.rs lists how they differ
  - status-form: the simulated device reports a kernel result where the driver delivers the NVMe status word unchanged
  - short-transfer: a simulated short fault classifies Short, and an NVMe status word never does
  - stop-proof: a simulated reset ends every command in one call, and the driver proves a stop from controller registers and keeps every command until then
  - reservation-commands: the simulated device reports no reservation limits and refuses a reservation command Unsupported, and a driver without an attach authority that reports reservation limits completes a Report and holds a share of its depth for reservation commands beside reads and writes, under a per-tick quota
  - registration: the simulated device accepts any buffer of the caller's arena, and a driver without an attach authority refuses a command NotVerified until its registered arena is verified, then refuses memory outside the arena InvalidRange
  - medium-gate: the simulated device serves with no medium admission, and a running driver with an attach authority refuses every read and write NotVerified until admit_medium names its own pair after its reservation gate passed
  - partial-sector-length: the simulated device panics on a partial block, and the driver refuses it InvalidRange
  - atomic-unit: the shared fixture's attach facts derive a 4096-byte atomic unit by default, smaller than the 16,384 bytes an EBS volume's attach facts derive, and under a held volume_fixture::Unit guard the unit the guard sets, which is the EBS unit in the wide-unit histories
  - fault-kinds: the simulated device never reports an omitted completion as a timeout, and the driver counts timeout callbacks
  - token-reuse: the simulated device panics on a reused pending token, and the driver takes a record of its own for it
  - controller-events: a scripted abort status reaches the caller and the simulated device keeps serving, and the driver turns gone at a controller event
  - the determinism lint's non-test build leaves bind, native, soak and storage::device::spdk unchecked, and those trees can read clocks, entropy, threads and sockets directly
  - the determinism lint's harness exceptions, each an allow or expect attribute with its reason at its site, permit in the simulation harness trees uses that crates/kestrike/clippy.toml disallows, as docs/agents/simulation.md, Determinism lint, describes
  - the determinism lint matches listed paths only: a use of another path to the same source passes it, sim::fork and sim::fork_tests allow the method lint for the whole module, and test-only simulation doubles such as storage::device::sim allow both lints
  - the bind exception of the lint also covers helpers that simulated code calls, so those helpers' clock, entropy and thread uses go unchecked
  - production-code exceptions leave unverified whether a simulated result depends on host hash keys (index/hash.rs, storage/cache/coverage.rs), host nonces (entropy.rs), a contended host sleep (storage/gate.rs) or scoped warm workers (storage/volume/warm.rs)
  - the copy is the simulation worker, the crate's module tree compiled under cfg(test), so test-only branches run; whether debug assertions are on follows the archive's recorded build settings, the entry gate's archive had them on, only a sweep that includes upload checks the setting through its asserting control, and with them on a failed debug assertion ends a run that the non-test release build runs past
  - one simulated world runs on one thread, and the recovery helpers and any store lane run their jobs inline on it, where production runs them on threads of their own, so a result and its fresh-process replay show nothing about thread timing, native races or memory ordering
  - the simulated worlds are small: a few owners, keys and clients at the profiles' default counts, where production runs a fleet
  - in-process datagram links that lose, duplicate, reorder and delay datagrams stand in for the network between owners and clients
  - the load is synthetic: generated workloads and scripted histories drive the cache, and no real client's retry or reconnect behavior
  - ordering: the turn controller holds the clock still while an event is runnable, so an order of the real code that needs time to pass while a runnable event waits forms in no run, such as a read of version 0 that completes before the upload's session reports it published; in the probes of blotter pull request 2117 that order formed in 0 of 300 cluster-broad roots and in 0 of 60,000 control runs
tools:
  - campaign, the supervisor binary built from crates/campaign-supervisor on the worker
  - the simulation archive that campaign sim archive writes, with its build digest
  - python3, for the validator, the probes and the judges
  - the AWS CLI and gh, for the credential probes of chaos/harness/reach.py
telemetry:
  - the sweep status document that campaign sweep-status prints for a root
  - the root's suspects.jsonl, a line for each listed suspect
  - the findings that campaign findings prints after campaign confirm
  - the harness's own history.jsonl and run.json for each run
  - no signal from a production fleet, since every run is a simulation
budgets:
  - a run deadline of 3600 s of wall clock for one campaign process, the workstream lead's sizing, ruled as it reads by the workstream's lead on the owner's delegation of 25 November 2026
  - the rehearsal budget, at most 12 runs for the whole campaign, at most 3 hours for the whole campaign, whichever ends first, the six hours of #297 shortened to three for the rehearsal of record, ruled as it reads by the workstream's lead on the owner's delegation of 25 November 2026
trusted_base:
  - the harness, chaos/harness/, and the campaign binary it drives, including campaign's classification of each run as pass, caught, uncredited or suspect
  - the judges under chaos/judges/ and their arithmetic over the evidence copies
  - the python interpreter and its environment, for the harness, the probes and the judges
  - the simulation worker's own checks that raise the rule texts the invariants name, each named in its row's oracle
  - each invariant's control, the control profile or failing history its row names, as a stand-in for the real defect it imitates, except k9-placement-judged-open, the control of ks-no-fill-admitted-after-close, which plants no cache defect: it skips the owner's close, so the check fails an open owner's legal grant
  - the reach control requires-invalidated-of-cluster-pressure, a campaign binary built outside the repository from a required-event table that requires an event cluster-pressure never reaches, as a stand-in for a change that stops a profile reaching a required event; it changes the table the gate reads and leaves the cache and the worker as they are
  - the commit that the reach control's binary was built from stands in the session's dated note in chaos/loop/log.md alone, as control.how of ks-required-events-reached states; a receipt binds that binary to its run through the SHA-256 in run.json and binds no line of the log, the log lies outside frozen_paths, later campaigns append to it and the campaign's identity can edit it, and no judge or freeze check reads it, so the note's commit rests on the session that wrote it and a receipt stays current when the note changes
  - the profiles that the scenario rows name, their default counts and fault rates, their controls, the rule texts the invariants quote and campaign's classification of a run live in crates/ outside frozen_paths, so a commit can change what a run offers or records and no freeze check reports it; the approval policy stops such a change for the owner
  - the copy's build path: campaign sim archive builds the worker from the checkout and campaign sweep verifies the archive before its first run and after its last, which ties a receipt to the worker; the campaign binary that classifies each run is built from the checkout and lies outside that digest
  - the worker binary with what the archive records beside it, and the validator by its SHA-256, are pinned, and the campaign binary, python3, the AWS CLI, gh and the installed skill's scripts (probe_fence.py, the writer of every fence receipt, and later render_loop.py and vacuity_check.py) float
  - the simulated datagram links both apply each link fault and write its record, so the injection oracle of ks-cluster-link-faults reads the injector's own report
  - ruled by the workstream's lead on the owner's delegation of 25 November 2026, OQ-6 of #297: each invariant row whose property.source.ref cites docs/agents/simulation.md, An agreed property, place 2, stands as property.agreed owner because an existing profile judges its rule text
  - the fleet fences probe the role's own account and this worker's own instance, since the worker's configuration names no bucket or instance of a live fleet and the workstream's lead ruled that the account-level probes stand; a grant of a named fleet bucket, by an identity-based policy or a bucket policy, and a stop permission scoped to fleet instances stay unprobed, and only the owner can name the fleets for a probe
  - the stopped-boundary observer reads each bound slot's record from the simulated device itself, takes the record's expected session, version and allocation from the storage's own slot facts and index bindings, and checks it with verify_header of crates/kestrike/src/storage/record/header.rs, which the serving read shares, and the test-only verify_chunk, which uses the cache's CRC table, Crc32c and record layout, so a defect in those tables, in the header check or in those primitives is shared by the cache and the oracle
  - ruled by the workstream's lead on the owner's delegation of 25 November 2026, OQ-12 of #297 and #298: the invariant ks-no-fill-admitted-after-close follows the storage::writable text "Close refuses new receives, reservations and publications.", which holds for candidate 1 of M0-4, since a hold granted after the close is a new reservation, the one-extent path already refuses it, and #298 is a defect of the several-extent path; the storage::readiness invariant ALLOCATION-READY, "Fills and builders admitted earlier keep their reservations or escrowed extents in every state.", reads the other way, and the broken status of ks-escape-2075 rests on the first
  - one identity, the Unix user tsw with the AWS role bsw-ct1-worker-host and the GitHub login of the owner, runs the harness and the fence probes, writes the receipts and sets each status, and it can also edit the ledger with its probe commands, the judges, the harness and the receipts
  - the ordering controls cluster-order-1, cluster-order-2 and cluster-order-3, as stand-ins for ordering defects of depth 1 to 3: the chooser picks each GET's issue and orders the events ready at one instant, and link draws and the clock rule decide when the others become ready, so their figure is the rate at which a drawn run ends in the row's rule, which the sweep does not tie to the read the plant changed
  - the control run of ks-ordering-controls-caught sweeps a scratch archive built from an unpushed one-line change to the worker's test tree, which the row's control.how states; its build digest, its retained archive on the worker and the run's label stand for that change, and the figure judge reads the label for the control the build leaves uncaught
  - the miss clause of ks-ordering-controls-caught has no control run: a miss raises the sweep's alarm, which makes its run invalid, so the judges' test of a built miss stands for it
  - unfenced reach: main has no protection applied to admins, and the campaign's GitHub login is an admin of the repository
  - unfenced reach: the campaign's GitHub token holds the scope repo for every repository of its login, which lets the login, an admin of this repository, register a deploy key with write access, and the scope admin:public_key, which can register an account SSH key; no OAuth scope limits a push over either key, a workflow file whose path and contents already stand on another branch passes the HTTPS refusal, and no token scoped to this repository bounds a push
  - the hold of ks-bound-record-passes-its-checks in ks-cluster-link-faults rests on the observer path that the control corrupted exercises in upload roots; no control runs that rule in a cluster root, where the sweep lists its text under rules.scopes.boundary.uncaught
  - the spend fence probes one paid action, a dry run of an EBS volume create; other paid actions, and the role's model calls, stay unprobed
  - the workflow fence reads the gh token's scopes; the survey read once that git's HTTPS push takes that token through gh auth git-credential, and no probe reads git's credential path again
  - unfenced reach: no second Unix user owns the frozen paths and the receipts, and the campaign's user can run commands as root through sudo, so it can write them directly or as root and read any credential on the host
  - unfenced reach: the simulation hosts' buckets, the first example assignment's and the recovery assignment's, are unnamed here, so no probe shows whether the campaign's role can reach either
  - ruled as it reads by the workstream's lead on the owner's delegation of 25 November 2026: the run deadline of 3600 s
  - ruled as it reads by the workstream's lead on the owner's delegation of 25 November 2026: runs_required of 2 valid held runs for a hold
  - ruled as it reads by the workstream's lead on the owner's delegation of 25 November 2026: the witness minimum of 64 passes for each profile of ks-upload-no-fault and ks-cluster-link-faults, counted as covered passes for a cluster profile; ks-escape-2075 counts 500 caught runs of its history and 500 passes of its twin, the tally of a scripted history in docs/agents/simulation.md
  - adopted by the owner in #180: the reach floor of 64 covered passes of ks-required-events-reached, the required-event table's REQUIRED_PASSES
  - ruled as it reads by the workstream's lead on the owner's delegation of 25 November 2026: the no_pass floor of 64 runs of a profile whose class is not control, with none counted under pass or caught, which the core validity judge turns into the verdict invalid and the reach judge into broken when it names a profile of the scenario
  - ruled as it reads by the workstream's lead on the owner's delegation of 25 November 2026: the rehearsal budget of 12 runs or 3 hours, the six hours of #297's M0-1 shortened to three by the workstream's lead for the rehearsal of record
  - ruled as it reads by the workstream's lead on the owner's delegation of 25 November 2026: restarts 20 in a swept recovery assignment, the count from which campaign sweep lists under no_window each stored planned crash window with a zero or folded total of a profile past the missing-window floor, and exits 1
  - ruled as it reads by the workstream's lead on the owner's delegation of 25 November 2026: the missing-window floor of 64 runs of a profile before no_window lists its windows, the floor no_pass uses
  - ruled as it reads by the workstream's lead on the owner's delegation of 25 November 2026: at most 5 seconds that a pull request of this contract adds to the suites of the pull-request tier, measured on the unit's worker and stated in the pull request
  - ruled as it reads by the workstream's lead on the owner's delegation of 25 November 2026: the harness's STOP_WAIT_S of 120 s from the SIGTERM of a stopped campaign command to its SIGKILL
  - ruled as it reads by the workstream's lead on the owner's delegation of 25 November 2026: the harness's POLL_S of 0.5 s, the longest wait between its looks at a running campaign command
  - ruled as it reads by the workstream's lead on the owner's delegation of 25 November 2026: the harness's JUDGE_WAIT_S of 600 s for one judge, past which the judge decides nothing and the run is incomplete
  - ruled as it reads by the workstream's lead on the owner's delegation of 25 November 2026: the byte bounds past which the harness or a judge refuses a record it reads, which decide no verdict from a count, 2^24 bytes for the ledger, a receipt, sweep.json and one suspects.jsonl line, as campaign bounds the last two, 2^28 bytes for one command's JSON output and for one evidence file, and 2^22 bytes for one judge file
  - ruled as it reads by the workstream's lead on the owner's delegation of 25 November 2026: at least 1,000 runs of each planted ordering control in one sweep that ended caught, missed or with no effect, below which the figure judge reports incomplete, and at or above which zero caught runs of a control is broken
  - ruled as it reads by the workstream's lead on the owner's delegation of 25 November 2026: at most 10,000,000 runs of one planted ordering control, the range in which the judges' test holds the lower bound's arithmetic to an exact calculation, above which the figure judge reports invalid
  - ruled as it reads by the workstream's lead on the owner's delegation of 25 November 2026: the one-sided confidence of 95% of the ordering figure's Clopper-Pearson lower bound, which takes each control's run count as fixed while the sweep's --for sets it by the wall clock
  - ruled as it reads by the workstream's lead on the owner's delegation of 25 November 2026: at most a confidence of 0.9999999 of that lower bound, the range in which the judges' test holds the bound's arithmetic to an exact calculation, above which the figure judge reports invalid
  - ruled as it reads by the workstream's lead on the owner's delegation of 25 November 2026: the greatest planted depth of 3 and one ordering control at each depth, which the figure covers
  - the production deployment carries no claim, since every run is a simulation on this worker
frozen_paths:
  - chaos/harness/
  - chaos/judges/
  - chaos/project.yaml
  - chaos/approval-policy.md
  - chaos/tools/validate_contract.py
freeze: the owner's merge of a change to chaos/, named by its full commit id
